name: pass2-fold
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fold modules
        run: bash scripts/pass2_fold.sh
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo nothing
            exit 0
          fi
          git commit -m "pass2: fold modules into cognitive/adversarial/hardening/memory/engines"
          git push
